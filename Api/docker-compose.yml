services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotique
      POSTGRES_PASSWORD: spotique
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotique"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails server -b 0.0.0.0
    environment:
      DATABASE_URL: postgres://spotique:spotique@db:5432/spotique_development
      RAILS_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bin/rails test
    environment:
      DATABASE_URL: postgres://spotique:spotique@db:5432/spotique_test
      RAILS_ENV: test
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - test

volumes:
  pgdata:
  bundle_cache:
